plugins {
    id 'com.android.application'
}

// MUSICDOWNLOADER_RELEASE_SIGNING_V1
def musicSigningFile = file(
    '/home/fran/MusicDownloader-clave-maestra/signing.json'
)

if (!musicSigningFile.isFile()) {
    throw new GradleException(
        'Falta la configuración privada de firma.'
    )
}

def musicSigning =
    new groovy.json.JsonSlurper()
        .parse(musicSigningFile)

android {
    signingConfigs {
        release {
            storeFile file(musicSigning.storeFile)
            storePassword musicSigning.storePassword
            keyAlias musicSigning.keyAlias
            keyPassword musicSigning.keyPassword
        }
    }

    namespace 'com.musicdownloader.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.musicdownloader.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
